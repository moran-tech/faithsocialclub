# Replaces the old GitHub Pages sponsorship site.
#
# The December 5, 2026 event was canceled. This job publishes a short pointer
# to https://f8social.club so the previous Pages deployment is replaced.
# The Vite site stays on Render.

name: Deploy GitHub Pages pointer

on:
  push:
    branches:
      - main
    paths:
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
      - "public/favicon.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          test -f .github/pages/index.html
          test -f public/favicon.png
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          cp public/favicon.png _site/favicon.png
          touch _site/.nojekyll
          if grep -Ei 'mixer|nazrana|early bird|317095315' _site/index.html; then
            echo "Pages index still promotes the canceled event"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
