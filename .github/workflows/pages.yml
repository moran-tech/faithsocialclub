# Publishes the sponsorship page to GitHub Pages.
#
# The Vite site stays on Render, where asset URLs are rooted at /.
# This repository's Pages site is a project site, so it is served under
# /<repo>/. Uploading dist/ would point the homepage at the wrong asset
# prefix and leave a broken copy next to the Render site.
# The sponsorship page is static HTML and does not use that prefix.
# Render still copies public/ into dist/ on its own builds.

name: Deploy sponsorship page

on:
  push:
    branches:
      - main
    paths:
      - "public/end-of-year-mixer-sponsors/**"
      - "public/favicon.png"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required sponsorship copy
        run: |
          page="public/end-of-year-mixer-sponsors/index.html"
          test -f "$page"
          python3 - "$page" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          lowered = text.lower()
          required = [
              "End of Year Mixer — Sponsorship Packages",
              "Social Club for Professionals (Surrey, BC)",
              "https://www.meetup.com/coworking-surrey-hosted-by-morantech/",
              "https://instagram.com/socialclub.pros",
              "@socialclub.pros",
              "Saturday, December 5, 2026",
              "6:30 to 9 p.m.",
              "Studio Nazrana",
              "13140 80 Ave, Surrey, BC",
              "About 50 guests",
              "Reach about 50 Surrey professionals from tech and other industries who can afford your products or services. The community has about 182 Meetup members.",
              "Sponsors choose the level that fits them.",
              "End of Year Mixer presented by [Your Brand]",
              "5-minute stage talk",
              "2-minute stage talk",
              "Stage talk",
              "5 min",
              "2 min",
              "main banner at the event",
              "pop-up spot to meet guests",
              "offer card in every goodie bag",
              "raffle prize draw on stage",
              "dedicated Instagram post before the event",
              "thank-you on stage",
              "logo on signage",
              "shared Instagram sponsor post",
              "Meetup mention",
              "Instagram story tag",
              "your products or offer card in every goodie bag",
              "one sponsor only",
              "$1,000",
              "$500",
              "$300",
              "Faith Morante",
              "faith.morante@gmail.com",
              "mailto:faith.morante@gmail.com",
              "Reply to the email or reach out to claim your level.",
          ]
          missing = [item for item in required if item.lower() not in lowered]
          if missing:
              print("Missing required copy:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)
          import re
          if re.search(r"ticket|per[-\s]?person|per guest|admission", lowered):
              print("Page mentions ticket prices or per-person costs")
              sys.exit(1)
          print("Sponsorship copy check passed")
          PY

      - name: Assemble Pages site
        run: |
          mkdir -p _site/end-of-year-mixer-sponsors
          cp -a public/end-of-year-mixer-sponsors/. _site/end-of-year-mixer-sponsors/
          cp public/favicon.png _site/favicon.png
          cp .github/pages/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
