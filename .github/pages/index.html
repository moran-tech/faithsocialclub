<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>f8 Social Club</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="canonical" href="https://f8social.club/" />
    <style>
      body {
        margin: 0;
        background: #fbf5ec;
        color: #1f3b2d;
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.5;
      }
      .stripe {
        height: 8px;
        background: linear-gradient(90deg, #1f3b2d 0 34%, #f2c9a1 34% 67%, #d5e6cf 67% 100%);
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        font-size: clamp(2rem, 1.4rem + 2vw, 2.8rem);
        line-height: 1.15;
        margin: 0 0 12px;
      }
      a {
        color: #1f3b2d;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid #1f3b2d;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="stripe" aria-hidden="true"></div>
    <main>
      <p>Surrey, BC</p>
      <h1>f8 Social Club</h1>
      <p><a href="https://f8social.club/">Visit f8social.club</a></p>
      <p><a href="https://f8social.club/events">See upcoming events</a></p>
    </main>
  </body>
</html>
