# Trailing-slash redirects and explicit rewrites for the existing f8social.club static site.
#
# Render serves a real file before it applies a route, so path/index.html would
# keep /path/ as a second 200. This build publishes each clean URL as
# dist/_pages/<path>.html and does not publish those directory indexes.
# The homepage stays dist/index.html.
#
# The December 5, 2026 event was canceled. Redirect both the detail URL and
# the old sponsorship URL to /events. Publish no directory index at either
# path, or Render serves that file and skips the redirect. Do not add a
# rewrite for the detail URL. A redirect for that path placed above a rewrite
# of the same path 301-looped on this service. Send both the slash and
# slashless forms straight to /events. Do not point either form at the other.
#
# If f8social.club already exists in Render, copy `routes` and `headers` onto
# that service. Do not sync this file as a second static site, and do not move
# the f8social.club domain onto a new service.
# Each public path has its own trailing-slash redirect and its own rewrite to
# /_pages/<path>.html. Do not add a /* catch-all rewrite. That rule redirected
# in a loop on this service. Unknown paths should stay 404s.
# Until these rewrites are on the service, the clean URLs 404.

services:
  - type: web
    runtime: static
    name: f8social
    buildCommand: npm install; npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUBSCRIBE_API_URL
        value: https://fireplace-waitlist.onrender.com/f8social/subscribe
    routes:
      - type: redirect
        source: /meetups-in-surrey/
        destination: /meetups-in-surrey
      - type: redirect
        source: /coworking-surrey/
        destination: /coworking-surrey
      - type: redirect
        source: /board-game-night-surrey/
        destination: /board-game-night-surrey
      - type: redirect
        source: /events/
        destination: /events
      - type: redirect
        source: /events/whitecaps-watch-party-2026-11-07/
        destination: /events/whitecaps-watch-party-2026-11-07
      - type: redirect
        source: /events/end-of-year-mixer-2026-12-05/
        destination: /events
      - type: redirect
        source: /events/end-of-year-mixer-2026-12-05
        destination: /events
      - type: redirect
        source: /end-of-year-mixer-sponsors/
        destination: /events
      - type: redirect
        source: /end-of-year-mixer-sponsors
        destination: /events
      - type: redirect
        source: /about/
        destination: /about
      - type: redirect
        source: /links/
        destination: /links
      - type: rewrite
        source: /meetups-in-surrey
        destination: /_pages/meetups-in-surrey.html
      - type: rewrite
        source: /coworking-surrey
        destination: /_pages/coworking-surrey.html
      - type: rewrite
        source: /board-game-night-surrey
        destination: /_pages/board-game-night-surrey.html
      - type: rewrite
        source: /events/whitecaps-watch-party-2026-11-07
        destination: /_pages/events/whitecaps-watch-party-2026-11-07.html
      - type: rewrite
        source: /events
        destination: /_pages/events.html
      - type: rewrite
        source: /about
        destination: /_pages/about.html
      - type: rewrite
        source: /links
        destination: /_pages/links.html
    headers:
      - path: /_pages/*
        name: X-Robots-Tag
        value: noindex
